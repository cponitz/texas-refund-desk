name: ci
# Every push and PR: Python tests, Deno tests for the edge-function validator, and the migration chain applied in order
# to a scratch Postgres (fails if a migration does not apply cleanly or the resulting schema is not what the code expects).
# Parity with the hosted database is checked by deploy.yml after a merge to main (SPEC-04 §8).
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: python -m pytest -q
      - name: generated findings.ts and G-9 snapshot must be current (SPEC-06, ADR 0016)
        run: python -m cleanbill.findings --emit-ts --emit-snapshot --check
      - name: generated brand files must be current and both themes must pass the contrast table (SPEC-08 Part C, ADR 0019)
        run: python -m cleanbill.brand --sync --check && python -m cleanbill.brand --contrast > /dev/null
      - name: e-mail parity snapshot must be current (SPEC-10 E1 — the Deno renderer is checked against it)
        run: python -m cleanbill.email --emit-snapshot --check
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno test --no-check --allow-read supabase/functions/process-claim/validate_test.ts supabase/functions/_shared/findings_test.ts supabase/functions/_shared/email_test.ts supabase/functions/_shared/webhook_sig_test.ts supabase/functions/claim/logic_test.ts supabase/functions/claim/card_test.ts supabase/functions/_shared/stripe_test.ts supabase/functions/ops/logic_test.ts supabase/functions/webhooks/logic_test.ts supabase/functions/webhooks/lob_test.ts
      - name: edge functions type-check
        # The jsr edge-runtime type shim references npm packages that are not installed here, so each entrypoint is
        # checked from a copy with that one import line removed (the runtime provides those globals in production).
        run: |
          set -e
          for f in claim process-claim ops selftest webhooks; do sed '/edge-runtime.d.ts/d' supabase/functions/$f/index.ts > supabase/functions/$f/index.check.ts; done
          deno check --node-modules-dir=none supabase/functions/_shared/*.ts supabase/functions/claim/logic.ts supabase/functions/claim/card.ts supabase/functions/webhooks/logic.ts supabase/functions/webhooks/lob.ts supabase/functions/*/index.check.ts
          rm supabase/functions/*/index.check.ts
  design-system:
    # SPEC-08 Part C lint: no colour or font literal outside apps/web/src/styles, every semantic token resolves in every
    # theme, and the web app type-checks (the Vercel build is the render check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run lint:design
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: trd }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d trd
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: shim the hosted-project roles and storage schema
        run: $PSQL -f supabase/ci/shim.sql
      - name: apply every migration in version order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do echo "== $f"; $PSQL -f "$f"; done
      - name: schema check
        run: $PSQL -f supabase/ci/check_schema.sql
      - name: backfill check (one account per e-mail; claims linked)
        run: |
          $PSQL -c "select count(*) as customers from customers; select count(*) filter (where customer_id is null) as unlinked_claims from claims;"
